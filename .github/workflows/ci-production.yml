# CI/CD — PRODUCTION
# Se ejecuta al mergear a main.
# El job de deploy requiere aprobación manual del dueño de main
# configurado en GitHub → Settings → Environments → production.

name: CI/CD — PRODUCTION

on:
  push:
    branches: [main]

# NO cancelar un deploy de producción en curso
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Tests + Lint (en paralelo) ───────────────────────────────────────────
  test:
    name: Tests
    uses: ./.github/workflows/cypress.yml
    secrets: inherit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebHomecourt/package-lock.json
      - run: npm ci
        working-directory: WebHomecourt
      # - run: npm run lint
      - run: echo "Aqui fuera el lint"
        working-directory: WebHomecourt
    # ── 2. ───────────────────────────────────────────
      
  db_diff:
    name: Comparar DEV vs PROD
    runs-on: [self-hosted, Linux, X64]
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4
      
      - name: Verificar results
        run: |
          which results
          results --help

      - name: Generar SQL para igualar PROD con DEV
        run: |
          mkdir -p generated-migrations

          results dbdiff \
            "${{ secrets.PROD_DB_URL }}" \
            "postgresql://postgres.a0gv:${{ secrets.DEV_DB_PASSWORD }}@localhost:5432/postgres" \
            --schema public \
            > generated-migrations/dev_to_prod.sql || true

          if [ ! -s generated-migrations/dev_to_prod.sql ]; then
            echo "-- No schema changes detected" > generated-migrations/dev_to_prod.sql
          fi

          echo "SQL generado:"
          cat generated-migrations/dev_to_prod.sql

      - name: Subir SQL generado
        uses: actions/upload-artifact@v4
        with:
          name: dev-to-prod-sql
          path: generated-migrations/dev_to_prod.sql
 # ── 3. Aplicar migraciones con aprobación ───────────────────────────────────
  migrate:
    name: Aplicar cambios DB → PROD
    runs-on: ubuntu-latest
    needs: db_diff
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dev-to-prod-sql
          path: generated-migrations

      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Mostrar SQL que se aplicará
        run: cat generated-migrations/dev_to_prod.sql

      - name: Bloquear SQL destructivo
        run: |
          if grep -Eiq "drop table|drop column|truncate|drop schema|drop database|drop extension|drop function|drop policy" generated-migrations/dev_to_prod.sql; then
          echo "⚠️ SQL destructivo detectado"
          cat generated-migrations/dev_to_prod.sql
          fi
      - name: Aplicar SQL a PROD
        run: |
          psql "${{ secrets.PROD_DB_URL }}" \
            -v ON_ERROR_STOP=1 \
            -f generated-migrations/dev_to_prod.sql
  # ── 3. Deploy a producción ───────────────────────────────────────────────────
  deploy:
    name: Deploy → PRODUCTION
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebHomecourt/package-lock.json

      - run: npm ci
        working-directory: WebHomecourt
      
      - run: npm install -g vercel

      - name: Pull configuración de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy a producción
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 4. Tag de release ────────────────────────────────────────────────────────
  tag:
    name: Crear tag de release
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - name: Tag con timestamp
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Release: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}